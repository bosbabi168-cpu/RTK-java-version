# =============================================================
# RTK-java technical configuration
# =============================================================
# Nilai-nilai teknis yang sebelumnya hardcode di source (ENCKEY,
# port default, tuning pool database, dsb).
#
# Catatan urutan prioritas:
#   1. File ini menyediakan nilai DEFAULT saat server start.
#   2. File conf/*.conf (format asli server C: login.conf, char.conf,
#      inter.conf, map.conf) tetap dibaca setelahnya dan MENIMPA nilai
#      yang sama (mis. login_port / char_port / map_port / lua_path).
#
# File ini ikut ter-copy ke build/classes (dan jar) oleh build.xml,
# lalu dibaca dari classpath oleh org.rtk.common.Props.

# ---- protocol / enkripsi paket (crypt.c) --------------------
# Key XOR statis packet obfuscation. HARUS sama dengan yang dipakai
# klien RetroTK — mengubahnya membuat klien tidak bisa terhubung.
crypt.enckey=Urk#nI7ni
# Key handshake yang dikirim ke klien saat versi cocok / redirect map.
crypt.handshake_key=KruIn7inc
# URL patch yang dikirim bila versi klien tidak cocok.
login.patch_url=http://files.kru.com/NexusTK/patch/

# ---- port default (di-override oleh conf/*.conf) ------------
login.port=2010
char.port=2005
map.port=2001

# ---- proteksi brute-force di login server -------------------
# Berapa kali salah password sebelum IP dikunci.
login.lockout_attempts=10
# Menit sebelum hitungan salah password di-reset / throttle dibersihkan.
login.lockout_minutes=10

# ---- koneksi ulang antar-server (detik) ---------------------
inter.reconnect_seconds=10

# ---- HikariCP connection pool -------------------------------
sql.pool_max=10
sql.pool_min_idle=2
sql.pool_connection_timeout_ms=10000
sql.pool_idle_timeout_ms=600000
sql.pool_max_lifetime_ms=1800000

# ---- networking ---------------------------------------------
# Buffer baca socket bersama (bytes).
net.read_buffer_bytes=65536
# Ukuran awal buffer per sesi (bytes, tumbuh otomatis).
net.session_buffer_bytes=4096

# ---- berkas peta (.map) -------------------------------------
# Folder berisi berkas .map, disalin dari rtkmaps/Accepted/.
# Nama berkas di tabel MySQL `Maps` (kolom MapFile) dicari relatif
# terhadap folder ini, termasuk yang memakai subfolder
# (mis. "games/sumo_war.map"). Di-override oleh map_path di conf/map.conf.
map.path=maps

# ---- lua scripting default (di-override map.conf) -----------
# Folder skrip: harus berisi Developers/sys.lua (dimuat pertama) lalu
# seluruh .lua di Accepted/ dan Developers/. Disalin dari rtklua/.
lua.enable=1
lua.path=luascript

# Folder berkas data teks (level_db.txt = tabel pengalaman per path,
# guide_db.txt). Di versi C path-nya hardcode "db/". Di-override oleh
# db_path di conf/map.conf.
db.path=db
